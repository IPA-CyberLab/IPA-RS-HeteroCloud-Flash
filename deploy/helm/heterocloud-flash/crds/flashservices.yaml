apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: flashservices.flash.heterocloud.io
spec:
  group: flash.heterocloud.io
  names:
    categories: []
    kind: FlashService
    plural: flashservices
    shortNames:
    - flash
    singular: flashservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for FlashServiceSpec via `CustomResource`
        properties:
          spec:
            properties:
              desired_generation:
                format: int64
                type: integer
              display_name:
                type: string
              organization_id:
                type: string
              project_id:
                type: string
              service_instance_id:
                type: string
              workload:
                properties:
                  args:
                    default: []
                    items:
                      type: string
                    type: array
                  autoscaling:
                    nullable: true
                    properties:
                      max_replicas:
                        format: uint32
                        maximum: 100000.0
                        minimum: 1.0
                        type: integer
                      min_replicas:
                        format: uint32
                        maximum: 100000.0
                        minimum: 1.0
                        type: integer
                      target_cpu_utilization_percent:
                        format: uint32
                        maximum: 100.0
                        minimum: 1.0
                        nullable: true
                        type: integer
                      target_memory_utilization_percent:
                        format: uint32
                        maximum: 100.0
                        minimum: 1.0
                        nullable: true
                        type: integer
                    required:
                    - max_replicas
                    - min_replicas
                    type: object
                    x-kubernetes-validations:
                    - message: max_replicas must be at least min_replicas
                      rule: self.max_replicas >= self.min_replicas
                    - message: at least one CPU or memory target is required
                      rule: has(self.target_cpu_utilization_percent) || has(self.target_memory_utilization_percent)
                  command:
                    default: []
                    items:
                      type: string
                    type: array
                  cpu_millis:
                    format: uint32
                    minimum: 0.0
                    type: integer
                  egress:
                    default:
                      allow_same_organization: false
                      allowed_destination_cidrs: []
                      denied_destination_cidrs: []
                      mode: internet
                    properties:
                      allow_same_organization:
                        default: false
                        type: boolean
                      allowed_destination_cidrs:
                        default: []
                        items:
                          type: string
                        maxItems: 64
                        type: array
                      denied_destination_cidrs:
                        default: []
                        items:
                          type: string
                        maxItems: 64
                        type: array
                      mode:
                        default: internet
                        enum:
                        - disabled
                        - restricted
                        - internet
                        type: string
                    type: object
                  env:
                    additionalProperties:
                      type: string
                    default: {}
                    type: object
                  ephemeral_storage_gib:
                    default: 10
                    format: uint32
                    maximum: 1000000.0
                    minimum: 1.0
                    type: integer
                  exposure:
                    properties:
                      allowed_source_cidrs:
                        default: []
                        items:
                          type: string
                        maxItems: 64
                        type: array
                      denied_source_cidrs:
                        default: []
                        items:
                          type: string
                        maxItems: 64
                        type: array
                      endpoint_mode:
                        default: ip
                        enum:
                        - ip
                        - load_balancer
                        - web
                        type: string
                      traffic_mode:
                        enum:
                        - forwarded
                        - direct
                        type: string
                      type:
                        enum:
                        - internal
                        - public
                        type: string
                    required:
                    - traffic_mode
                    - type
                    type: object
                    x-kubernetes-validations:
                    - message: load_balancer and web require public forwarded exposure
                      rule: '!has(self.endpoint_mode) || !(self.endpoint_mode in [''load_balancer'', ''web'']) || (self.type == ''public'' && self.traffic_mode == ''forwarded'')'
                    - message: web does not yet support source CIDR filters
                      rule: '!has(self.endpoint_mode) || self.endpoint_mode != ''web'' || ((!has(self.allowed_source_cidrs) || size(self.allowed_source_cidrs) == 0) && (!has(self.denied_source_cidrs) || size(self.denied_source_cidrs) == 0))'
                  image:
                    type: string
                  memory_mib:
                    format: uint32
                    minimum: 0.0
                    type: integer
                  metadata:
                    additionalProperties: true
                    default: {}
                    type: object
                  ports:
                    items:
                      properties:
                        container_port:
                          format: uint16
                          maximum: 65535.0
                          minimum: 0.0
                          type: integer
                        name:
                          type: string
                        protocol:
                          enum:
                          - tcp
                          - udp
                          type: string
                        service_port:
                          format: uint16
                          maximum: 65535.0
                          minimum: 0.0
                          type: integer
                      required:
                      - container_port
                      - name
                      - protocol
                      - service_port
                      type: object
                    type: array
                  region:
                    type: string
                  replicas:
                    format: uint32
                    minimum: 0.0
                    type: integer
                required:
                - cpu_millis
                - exposure
                - image
                - memory_mib
                - ports
                - region
                - replicas
                type: object
                x-kubernetes-validations:
                - message: replicas must be within autoscaling bounds
                  rule: '!has(self.autoscaling) || (self.replicas >= self.autoscaling.min_replicas && self.replicas <= self.autoscaling.max_replicas)'
                - message: web requires exactly one TCP port
                  rule: '!has(self.exposure.endpoint_mode) || self.exposure.endpoint_mode != ''web'' || (size(self.ports) == 1 && self.ports.all(p, p.protocol == ''tcp''))'
            required:
            - desired_generation
            - display_name
            - organization_id
            - project_id
            - service_instance_id
            - workload
            type: object
          status:
            nullable: true
            properties:
              desired_replicas:
                format: int32
                type: integer
              endpoints:
                default: []
                items:
                  properties:
                    host:
                      type: string
                    name:
                      type: string
                    port:
                      format: uint16
                      maximum: 65535.0
                      minimum: 0.0
                      type: integer
                    protocol:
                      enum:
                      - tcp
                      - udp
                      type: string
                  required:
                  - host
                  - name
                  - port
                  - protocol
                  type: object
                type: array
              image_size_bytes:
                format: uint64
                minimum: 0.0
                nullable: true
                type: integer
              message:
                nullable: true
                type: string
              observed_generation:
                format: int64
                type: integer
              phase:
                enum:
                - provisioning
                - ready
                - error
                type: string
              ready_replicas:
                format: int32
                type: integer
              resolved_image:
                nullable: true
                type: string
              runtime_class:
                type: string
              writable_storage_bytes:
                format: uint64
                minimum: 0.0
                nullable: true
                type: integer
            required:
            - desired_replicas
            - observed_generation
            - phase
            - ready_replicas
            - runtime_class
            type: object
        required:
        - spec
        title: FlashService
        type: object
    served: true
    storage: true
    subresources:
      status: {}
