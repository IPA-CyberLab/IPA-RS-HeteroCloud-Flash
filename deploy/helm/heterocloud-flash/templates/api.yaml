apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flash.fullname" . }}-api
  labels:
    {{- include "flash.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flash.name" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "flash.name" . }}
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: heterocloud
    spec:
      terminationGracePeriodSeconds: 2100
      serviceAccountName: {{ include "flash.serviceAccountName" . }}
      securityContext:
        {{- include "flash.podSecurityContext" . | nindent 8 }}
      affinity:
        {{- include "flash.affinity" (dict "root" . "component" "api") | nindent 8 }}
      containers:
        - name: api
          image: {{ .Values.api.image | default (include "flash.image" .) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/flash-api"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: FLASH_BACKUP_DESTINATIONS_ENABLED
              value: {{ .Values.backups.destinations.enabled | quote }}
            {{- if .Values.backups.destinations.enabled }}
            - name: FLASH_BACKUP_S3_PROXY_KEY_FILE
              value: /var/run/flash-backup-s3-proxy/hmac-key
            - name: FLASH_BACKUP_S3_PROXY_URL
              value: {{ printf "http://%s-backup-s3-proxy.%s.svc.cluster.local:%v" (include "flash.fullname" .) .Release.Namespace .Values.backups.destinations.proxyPort | quote }}
            - name: FLASH_BACKUP_RESTORE_STORAGE_CLASS
              value: {{ .Values.persistence.storageClass | quote }}
            - name: FLASH_BACKUP_VERIFY_STORAGE_CLASS
              value: {{ .Values.backups.verification.storageClass | quote }}
            {{- end }}
            - name: FLASH_BACKUP_STORAGE_NAMESPACE
              value: {{ .Values.backups.storageNamespace | quote }}
            - name: FLASH_BACKUP_SNAPSHOT_CLASS
              value: {{ .Values.backups.snapshotClass | quote }}
            - name: FLASH_API_BIND_ADDR
              value: "0.0.0.0:{{ .Values.api.port }}"
            - name: FLASH_WORKLOAD_NAMESPACE
              value: {{ .Values.workloadNamespace | quote }}
            - name: FLASH_PUBLIC_DOMAIN
              value: {{ .Values.publicDomain | quote }}
            - name: FLASH_MAX_EXEC_SESSIONS
              value: {{ .Values.api.maxExecSessions | quote }}
            - name: HETEROCLOUD_PROVIDER_ISSUER
              value: {{ .Values.providerAuth.issuer | quote }}
            - name: HETEROCLOUD_PROVIDER_AUDIENCE
              value: {{ .Values.providerAuth.audience | quote }}
            - name: HETEROCLOUD_PROVIDER_PUBLIC_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ include "flash.providerSecretName" . }}
                  key: {{ .Values.providerAuth.publicKeysSecretKey }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          securityContext:
            {{- include "flash.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- if .Values.backups.destinations.enabled }}
          volumeMounts:
            - name: backup-s3-proxy-key
              mountPath: /var/run/flash-backup-s3-proxy
              readOnly: true
          {{- end }}
      {{- if .Values.backups.destinations.enabled }}
      volumes:
        - name: backup-s3-proxy-key
          secret:
            secretName: {{ .Values.backups.destinations.proxySecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.backups.destinations.proxySecretKey | quote }}
                path: hmac-key
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flash.fullname" . }}-api
  labels:
    {{- include "flash.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "flash.name" . }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
