apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "flash.fullname" . }}
  namespace: {{ .Values.workloadNamespace }}
  labels:
    {{- include "flash.labels" . | nindent 4 }}
rules:
  - apiGroups: ["flash.heterocloud.io"]
    resources: ["flashservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["flash.heterocloud.io"]
    resources: ["flashservices/status", "flashservices/finalizers"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    # Kubernetes WebSocket exec uses GET while the legacy SPDY transport uses
    # POST. Support both transports without granting other Pod mutations.
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "flash.fullname" . }}
  namespace: {{ .Values.workloadNamespace }}
  labels:
    {{- include "flash.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flash.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "flash.fullname" . }}
