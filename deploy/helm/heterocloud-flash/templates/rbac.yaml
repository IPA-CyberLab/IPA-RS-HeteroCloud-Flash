apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "flash.fullname" . }}
  namespace: {{ .Values.workloadNamespace }}
  labels:
    {{- include "flash.labels" . | nindent 4 }}
rules:
  - apiGroups: ["flash.heterocloud.io"]
    resources: ["flashbackups"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["flash.heterocloud.io"]
    resources: ["flashbackups/status", "flashbackups/finalizers"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["flash.heterocloud.io"]
    resources: ["flashdomains"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["securitypolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["flash.heterocloud.io"]
    resources: ["flashservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["flash.heterocloud.io"]
    resources: ["flashservices/status", "flashservices/finalizers"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["flash.heterocloud.io"]
    resources: ["flashgpujobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["flash.heterocloud.io"]
    resources: ["flashgpujobs/status", "flashgpujobs/finalizers"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["flash.heterocloud.io"]
    resources: ["flashusagerecords"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    # Kubernetes WebSocket exec uses GET while the legacy SPDY transport uses
    # POST. Support both transports without granting other Pod mutations.
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "flash.fullname" . }}
  namespace: {{ .Values.workloadNamespace }}
  labels:
    {{- include "flash.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flash.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "flash.fullname" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "flash.fullname" . }}-gpu-scheduler
  labels:
    {{- include "flash.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get"]
  - apiGroups: ["flash.heterocloud.io"]
    resources: ["flashgpudevices"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["flash.heterocloud.io"]
    resources: ["flashgpudevices/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "flash.fullname" . }}-gpu-scheduler
  labels:
    {{- include "flash.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flash.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "flash.fullname" . }}-gpu-scheduler

{{- if .Values.backups.snapshotClass }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "flash.fullname" . }}-restore-observer
  namespace: {{ .Values.backups.storageNamespace }}
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "flash.fullname" . }}-restore-observer
  namespace: {{ .Values.backups.storageNamespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flash.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "flash.fullname" . }}-restore-observer
{{- end }}
