{{- if .Values.runtimeClass.create }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.runtimeClass.name }}
  labels:
    {{- include "flash.labels" . | nindent 4 }}
handler: {{ .Values.runtimeClass.handler }}
{{- with .Values.runtimeClass.nodeSelector }}
scheduling:
  nodeSelector:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}

