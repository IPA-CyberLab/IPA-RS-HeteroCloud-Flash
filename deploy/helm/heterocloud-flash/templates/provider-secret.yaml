{{- if not .Values.providerAuth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flash.providerSecretName" . }}
  labels:
    {{- include "flash.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.providerAuth.publicKeysSecretKey }}: {{ required "providerAuth.publicKeysJson or providerAuth.existingSecret is required" .Values.providerAuth.publicKeysJson | quote }}
{{- end }}

