name: Workload safety and backup operations
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: python3 -B -m unittest discover -s ops -p 'test_*.py' -v
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: ./scripts/generate-crd.sh && git diff --exit-code
      - uses: azure/setup-helm@v5
      - run: helm lint --strict deploy/helm/heterocloud-flash
      - name: Render production safety features
        run: >-
          helm template heterocloud-flash deploy/helm/heterocloud-flash
          --set providerAuth.existingSecret=validation
          --set capacity.enabled=true
          --set backups.snapshotClass=flash-disk-backup
          --set backups.verification.enabled=true
          --set backups.offsite.enabled=true
          > /tmp/flash-operations.yaml
