name: Capacity admission image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'ops/capacity.py'
      - 'ops/test_capacity.py'
      - 'ops/capacity-image.Dockerfile'
      - 'deploy/helm/heterocloud-flash/**'
      - '.github/workflows/capacity-image.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s ops -p test_capacity.py -v
      - uses: azure/setup-helm@v5
      - run: |
          helm lint --strict deploy/helm/heterocloud-flash
          helm template flash deploy/helm/heterocloud-flash --set capacity.enabled=true --set providerAuth.existingSecret=validation --set capacity.image=ghcr.io/example/capacity@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa > /tmp/capacity-render.yaml
          grep -q 'image: "ghcr.io/example/capacity@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"' /tmp/capacity-render.yaml

  image:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/capacity-image.Dockerfile
          push: true
          tags: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-flash-capacity:${{ github.sha }}
          provenance: false
