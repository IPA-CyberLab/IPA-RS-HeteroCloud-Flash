name: Flash zone placement

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deploy/helm/heterocloud-flash/**'
      - 'ops/controller-image.Dockerfile'
      - 'scripts/zone-placement-kind-e2e.py'
      - '.github/workflows/zone-placement.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deploy/helm/heterocloud-flash/**'
      - 'ops/controller-image.Dockerfile'
      - 'scripts/zone-placement-kind-e2e.py'
      - '.github/workflows/zone-placement.yml'

permissions:
  contents: read

jobs:
  verify-and-zone-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      FLASH_ZONE_E2E_OUTPUT: /tmp/flash-zone-fixtures
      FLASH_ZONE_E2E: kind-only
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt,clippy
      - name: Verify controller and generate real placement fixtures
        run: |
          cargo fmt --all -- --check
          cargo test --locked --lib
          cargo test --locked --bin flash-controller
          cargo clippy --locked --all-targets -- -D warnings
          test -s "$FLASH_ZONE_E2E_OUTPUT/required.json"
          test -s "$FLASH_ZONE_E2E_OUTPUT/preferred.json"
      - uses: azure/setup-helm@v5
      - name: Validate chart and configuration
        run: |
          helm lint --strict deploy/helm/heterocloud-flash --set providerAuth.existingSecret=validation
          helm template flash deploy/helm/heterocloud-flash --set providerAuth.existingSecret=validation --set controller.zoneSpread=required > "$RUNNER_TEMP/flash-zone-chart.yaml"
          grep -A 1 'name: FLASH_ZONE_SPREAD' "$RUNNER_TEMP/flash-zone-chart.yaml" | grep -q 'value: "required"'
          if helm template flash deploy/helm/heterocloud-flash --set controller.zoneSpread=invalid > /dev/null 2>&1; then
            echo 'invalid zone policy was accepted' >&2
            exit 1
          fi
      - name: Create disposable two-site Kubernetes cluster
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flash-zone-cluster"
          curl --fail --location --silent --show-error --retry 2 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o "$RUNNER_TEMP/flash-zone-cluster/kind"
          curl --fail --location --silent --show-error --retry 2 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum -o "$RUNNER_TEMP/flash-zone-cluster/kind.sha256sum"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'flash-zone-cluster'
          assert hashlib.sha256((root / 'kind').read_bytes()).hexdigest() == (root / 'kind.sha256sum').read_text().split()[0]
          (root / 'cluster.yaml').write_text('kind: Cluster\napiVersion: kind.x-k8s.io/v1alpha4\nnodes:\n  - role: control-plane\n  - role: worker\n  - role: worker\n')
          PY
          chmod 0755 "$RUNNER_TEMP/flash-zone-cluster/kind"
          "$RUNNER_TEMP/flash-zone-cluster/kind" create cluster --name flash-zone-e2e --wait 180s --config "$RUNNER_TEMP/flash-zone-cluster/cluster.yaml" --image kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
      - name: Exercise site loss and recovery with the Kubernetes scheduler
        run: python3 -B scripts/zone-placement-kind-e2e.py "$FLASH_ZONE_E2E_OUTPUT"
      - name: Show non-secret scheduling diagnostics
        if: failure()
        run: |
          kubectl --context kind-flash-zone-e2e get nodes,pods -A -o wide || true
          kubectl --context kind-flash-zone-e2e -n flash-zone-e2e get events --sort-by=.lastTimestamp || true
      - name: Remove disposable cluster
        if: always()
        run: |
          if test -x "$RUNNER_TEMP/flash-zone-cluster/kind"; then
            "$RUNNER_TEMP/flash-zone-cluster/kind" delete cluster --name flash-zone-e2e || true
          fi

  image:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: verify-and-zone-e2e
    permissions: {contents: read, packages: write}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ops/controller-image.Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-flash-controller:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=zone-controller-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=zone-controller-${{ matrix.arch }}
      - run: printf '%s' "$DIGEST" > "$RUNNER_TEMP/digest-${ARCH}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flash-controller-digest-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/digest-${{ matrix.arch }}
          if-no-files-found: error

  manifest:
    needs: image
    permissions: {contents: read, packages: write}
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: flash-controller-digest-*-${{ github.run_attempt }}
          path: digests
          merge-multiple: true
      - name: Publish immutable multi-architecture controller image
        run: |
          set -euo pipefail
          repo=ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-flash-controller
          amd64=$(cat digests/digest-amd64)
          arm64=$(cat digests/digest-arm64)
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ && "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --metadata-file index.json --tag "$repo:$GITHUB_SHA" "$repo@$amd64" "$repo@$arm64"
          jq -er '.["containerimage.descriptor"].digest | select(test("^sha256:[0-9a-f]{64}$"))' index.json | tee -a "$GITHUB_STEP_SUMMARY"
