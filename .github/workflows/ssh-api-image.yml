name: Flash SSH provider image
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ops/ssh-api-image.Dockerfile'
      - '.github/workflows/ssh-api-image.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ops/ssh-api-image.Dockerfile'
      - '.github/workflows/ssh-api-image.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: 1.96.1, components: 'rustfmt,clippy'}
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --bin flash-api ssh_
      - run: cargo clippy --locked --bin flash-api -- -D warnings
  image:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions: {contents: read, packages: write}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ops/ssh-api-image.Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-flash-ssh-api:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=ssh-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ssh-${{ matrix.arch }}
      - run: printf '%s' "$DIGEST" > "$RUNNER_TEMP/digest-${ARCH}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-api-digest-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/digest-${{ matrix.arch }}
          if-no-files-found: error
  manifest:
    needs: image
    permissions: {contents: read, packages: write}
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: ssh-api-digest-*-${{ github.run_attempt }}
          path: digests
          merge-multiple: true
      - name: Publish immutable multi-architecture index
        shell: bash
        run: |
          set -Eeuo pipefail
          repo=ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-flash-ssh-api
          amd64=$(cat digests/digest-amd64)
          arm64=$(cat digests/digest-arm64)
          [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ && "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create --metadata-file index.json --tag "$repo:$GITHUB_SHA" "$repo@$amd64" "$repo@$arm64"
          jq -er '.["containerimage.descriptor"].digest | select(test("^sha256:[0-9a-f]{64}$"))' index.json
