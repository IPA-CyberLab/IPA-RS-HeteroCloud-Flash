[package]
name = "heterocloud-flash"
version = "0.1.12"
edition = "2024"
license = "MIT"
repository = "https://github.com/IPA-CyberLab/IPA-RS-HeteroCloud-Flash"
rust-version = "1.96"
default-run = "flash-api"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["http2", "macros", "ws"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
http = "1.4"
jsonwebtoken = { version = "11.0", features = ["rust_crypto"] }
k8s-openapi = { version = "0.27", features = ["v1_35"] }
kube = { version = "=3.0.1", default-features = false, features = ["client", "derive", "ring", "runtime", "rustls-tls", "ws"] }
oci-client = { version = "0.17", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1.49", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["catch-panic", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"
uuid = { version = "1.20", features = ["serde", "v5", "v7"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
